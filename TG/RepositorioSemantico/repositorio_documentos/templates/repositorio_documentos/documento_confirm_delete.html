{% extends 'repositorio_dashboard/base_repositorio.html' %}{% block title %}Eliminar documento{% endblock %}{% block content %}<div class="welcome mx-auto" style="max-width:620px"><section class="surface p-4 p-md-5 text-center"><span class="stat-icon mx-auto mb-3" style="background:#fdecec;color:#b42318"><i class="fa-solid fa-trash"></i></span><h1 class="h3 fw-bold">Eliminar documento</h1><p class="text-muted">¿Confirmas que deseas eliminar “{{ documento.titulo }}”? Esta acción no se puede deshacer.</p><form method="post" data-loading-form data-confirm="¿Eliminar definitivamente este documento?">{% csrf_token %}<button class="btn btn-danger" type="submit"><i class="fa-solid fa-trash me-2"></i>Eliminar definitivamente</button><a class="btn btn-link text-secondary" href="{{ documento.get_absolute_url }}">Cancelar</a></form></section></div>{% endblock %}
